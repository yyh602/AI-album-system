; 自訂 PHP 設定檔 - 強制設定上傳限制
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 7200
max_input_time = 7200
memory_limit = 512M
max_file_uploads = 100
file_uploads = On

; 錯誤報告設定
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /home/site/wwwroot/php_errors.log

; 會話設定
session.gc_maxlifetime = 7200
session.cookie_lifetime = 7200

; 擴展設定
extension=mysqli
extension=gd
extension=exif
extension=imagick
